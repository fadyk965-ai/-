<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف الذكي - YAM</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .company-logo {
            font-size: 36px;
            font-weight: bold;
            color: #007bff;
            margin: 0 0 5px 0;
            font-family: 'Arial Black', sans-serif;
        }

        h2 { color: #333; margin-top: 0; margin-bottom: 25px; font-size: 20px; }

        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .site-select, .name-input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            outline: none;
            box-sizing: border-box;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-attendance { background-color: #2ecc71; }
        .btn-attendance:hover { background-color: #27ae60; }

        .btn-departure { background-color: #e74c3c; }
        .btn-departure:hover { background-color: #c0392b; }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .online { background-color: #d4edda; color: #155724; }
        .offline { background-color: #f8d7da; color: #721c24; }

        .log-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-right: 4px solid #3498db;
            border-radius: 4px;
            text-align: right;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .dashboard-mini {
            margin-top: 25px;
            border-top: 2px dashed #e0e0e0;
            padding-top: 15px;
            text-align: right;
        }
        .dashboard-mini h3 { font-size: 16px; color: #333; margin-bottom: 10px; }
        .shift-info {
            background-color: #e8f4fd;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #1a73e8;
        }

        /* تنسيقات قسم المدير السري */
        .admin-section {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 2px solid #eee;
            text-align: center;
        }
        .admin-toggle {
            font-size: 12px;
            color: #999;
            cursor: pointer;
            text-decoration: underline;
        }
        .admin-content {
            display: none;
            margin-top: 10px;
        }
        .btn-excel {
            background-color: #1f7246;
            color: white;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-excel:hover { background-color: #155231; }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="company-logo">YAM</h1>
        <h2>نظام الحضور والانصراف الذكي</h2>
        
        <div id="networkStatus" class="status-badge online">🌐 متصل بالإنترنت</div>

        <div class="form-group">
            <label for="employeeName">👤 اسم الموظف:</label>
            <input type="text" id="employeeName" class="name-input" placeholder="اكتب اسمك بالكامل أول مرة فقط">
        </div>

        <div class="form-group">
            <label for="locationSelect">📍 اختر موقع العمل المتوقع:</label>
            <select id="locationSelect" class="site-select">
                <option value="">-- اختر الموقع من هنا --</option>
                <option value="المقر الرئيسي">المقر الرئيسي</option>
                <option value="موقع التجمع الخامس">موقع التجمع الخامس</option>
                <option value="موقع العاصمة الإدارية">موقع العاصمة الإدارية</option>
                <option value="مخزن الامام الشافعي">مخزن الامام الشافعي</option>
                <option value="9 سايد">9 سايد</option>
                <option value="محل سبايسي تشيكن البير">محل سبايسي تشيكن البير</option>
                <option value="محل سبايسي تشيكن مدينه نصر">محل سبايسي تشيكن مدينه نصر</option>
                <option value="فيلا الحج محمد اب تاون">فيلا الحج محمد اب تاون</option>
                <option value="اب تاون">اب تاون</option>
                <option value="مزرعه الحج محمد">مزرعه الحج محمد</option>
                <option value="مشروع نيكست الهضبي الوسطي">مشروع نيكست الهضبي الوسطي</option>
                <option value="مصنع جرجس التجمع ">مصنع جرجس التجمع</option>
                <option value="جدران زهراء المعادي">جدران زهراء المعادي</option>
            </select>
        </div>

        <div class="btn-container">
            <button class="btn btn-attendance" onclick="startProcess('حضور')">تسجيل حضور</button>
            <button class="btn btn-departure" onclick="withCheckOutLogic()">تسجيل انصراف</button>
        </div>

        <div class="log-box" id="logBox">
            لم يتم تسجيل أي عملية بعد.
        </div>

        <div class="dashboard-mini">
            <h3>📊 ملخص الوردية اليوم:</h3>
            <div id="shiftStats" class="shift-info">
                لم يتم تسجيل حضور وانصراف لليوم لحساب الساعات بعد.
            </div>
        </div>

        <div class="admin-section">
            <span class="admin-toggle" onclick="toggleAdminPanel()">🔒 لوحة التحكم للمدير (إكسيل)</span>
            <div id="adminContent" class="admin-content">
                <input type="password" id="adminPass" class="name-input" placeholder="أدخل كلمة مرور المدير" style="text-align: center; margin-bottom: 5px;">
                <button class="btn-excel" onclick="exportToExcel()">تحميل تقرير إكسيل محلي 📊</button>
                <button class="btn-excel" onclick="clearAllData()" style="background-color: #c0392b; margin-top: 5px; font-size: 12px;">تصفير السجل المحلي للبيانات ⚠️</button>
            </div>
        </div>
    </div>

    <script>
        const logBox = document.getElementById('logBox');
        const locationSelect = document.getElementById('locationSelect');
        const employeeNameInput = document.getElementById('employeeName');
        const networkStatus = document.getElementById('networkStatus');
        const shiftStats = document.getElementById('shiftStats');
        
        // إعدادات التليجرام الثابتة الخاصة بك
        const TELEGRAM_BOT_TOKEN = '8899159530:AAEnYvrr7Y_whfUO0T7-HeIgbWfy33oi7ME';
        const TELEGRAM_CHAT_ID = '-1003959462967'; 
        
        // 🔗 ⚠️ ضع هنا رابط سيرفر بايثون الحقيقي الخاص بك على ريلواي المنتهي بـ /save_attendance
        const PYTHON_SERVER_URL = 'https://YOUR-RAILWAY-APP-URL.up.railway.app/save_attendance';

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        function updateNetworkStatus() {
            if (navigator.onLine) {
                networkStatus.innerHTML = "🌐 متصل بالإنترنت";
                networkStatus.className = "status-badge online";
                syncOfflineData(); 
            } else {
                networkStatus.innerHTML = "📡 وضع الأوفلاين (الشبكة مقطوعة)";
                networkStatus.className = "status-badge offline";
            }
        }

        window.onload = function() {
            updateNetworkStatus();
            
            const savedName = localStorage.getItem('emp_name');
            if (savedName) {
                employeeNameInput.value = savedName;
            }

            const todayDateStr = new Date().toLocaleDateString('ar-EG');
            const lastSavedDate = localStorage.getItem('last_saved_date');
            if (lastSavedDate && lastSavedDate !== todayDateStr) {
                localStorage.removeItem('today_check_in');
                localStorage.removeItem('today_check_out');
            }
            localStorage.setItem('last_saved_date', todayDateStr);

            updateMiniDashboard();
        };

        function startProcess(type) {
            const empName = employeeNameInput.value.trim();
            const selectedLocation = locationSelect.value;

            if (!empName) { alert("برجاء كتابة الاسم بالكامل أولاً!"); return; }
            if (!selectedLocation) { alert("برجاء اختيار موقع العمل أولاً!"); return; }

            localStorage.setItem('emp_name', empName);

            logBox.innerHTML = "⏳ جاري تحديد موقعك الجغرافي الدقيق وتحليل العنوان...";
            logBox.style.borderRightColor = '#f1c40f';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        const realAddress = await getAddressFromCoords(lat, lng);
                        processData(type, lat, lng, selectedLocation, empName, realAddress);
                    },
                    (error) => { 
                        processData(type, 0, 0, selectedLocation, empName, "غير متاح (تم رفض إذن تحديد الموقع)");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                processData(type, 0, 0, selectedLocation, empName, "المتصفح لا يدعم تحديد الموقع");
            }
        }

        async function getAddressFromCoords(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
                const data = await response.json();
                if (data && data.display_name) {
                    return data.display_name;
                }
                return "يتعذر تحديد اسم المنطقة بدقة";
            } catch (error) {
                return "تم جلب الإحداثيات (وتعذر الاتصال بخادم العناوين)";
            }
        }

        function withCheckOutLogic() {
            startProcess('انصراف');
        }

        function processData(type, lat, lng, locationName, empName, realAddress) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString('ar-EG');

            let isLateDeparture = false;
            if (type === 'انصراف' && now.getHours() >= 19) {
                isLateDeparture = true;
            }

            if (type === 'حضور') {
                localStorage.setItem('today_check_in', now.toISOString());
            } else {
                localStorage.setItem('today_check_out', now.toISOString());
            }
            updateMiniDashboard();

            const totalHoursFormatted = calculateShiftHours();
            const mapUrl = lat !== 0 ? `https://www.google.com/maps?q=${lat},${lng}` : "غير متاح";

            const payload = {
                "نوع العملية": type,
                "اسم الموظف": empName,
                "الموقع المستهدف": locationName,
                "العنوان الفعلي الحالي": realAddress,
                "التاريخ": dateString,
                "الوقت": timeString,
                "إجمالي ساعات العمل": totalHoursFormatted,
                "انصراف متأخر": isLateDeparture ? "نعم (يوم ونص)" : "لا",
                "رابط الخريطة": mapUrl,
                "أوفلاين": !navigator.onLine ? "نعم" : "لا"
            };

            // 💾 1. حفظ نسخة في المتصفح احتياطياً للتقارير اليدوية
            saveDataToSystemLog(payload);

            // 💻 2. إرسال البيانات فوراً لسيرفر بايثون على ريلواي ليخزنها في قاعدة البيانات السحابية
            if (navigator.onLine) {
                sendToPythonServer(payload);
            } else {
                saveDataOffline(payload);
                logBox.innerHTML = `
                    📥 <strong>تم الحفظ في وضع الأوفلاين!</strong><br>
                    تم تسجيل الحركة محلياً بنجاح، وسترسل لقاعدة البيانات والتليجرام فور توفر الإنترنت.
                `;
                logBox.style.borderRightColor = '#e67e22';
                return;
            }

            // 🔔 3. إرسال الإشعار لقناة التليجرام المربوطة
            sendToTelegram(payload);
        }

        function sendToPythonServer(payload) {
            const serverData = {
                employee: payload["اسم الموظف"],
                type: payload["نوع العملية"],
                target_location: payload["الموقع المستهدف"],
                actual_location: payload["العنوان الفعلي الحالي"],
                date: payload["التاريخ"],
                time: payload["الوقت"],
                hours: payload["إجمالي ساعات العمل"]
            };

            fetch(PYTHON_SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(serverData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    console.log("--> Successfully synced with Cloud Database via Railway.");
                }
            })
            .catch(error => {
                console.error("--> Railway Server connection failed:", error);
            });
        }

        function sendToTelegram(payload) {
            let message = `🔔 *تسجيل ${payload["نوع العملية"]} جديد* \n\n`;
            message += `👤 *الموظف:* ${payload["اسم الموظف"]}\n`;
            message += `📍 *الموقع المستهدف:* ${payload["الموقع المستهدف"]}\n`;
            message += `🌍 *الموقع الفعلي الحالي:* ${payload["العنوان الفعلي الحالي"]}\n`;
            message += `📅 *التاريخ:* ${payload["التاريخ"]}\n`;
            message += `⏰ *الوقت المعتمد:* ${payload["الوقت"]}\n`;
            message += `⏱️ *إجمالي ساعات العمل اليوم:* ${payload["إجمالي ساعات العمل"]}\n`;
            message += `🕒 *انصراف متأخر:* ${payload["انصراف متأخر"]}\n`;
            
            if(payload["رابط الخريطة"] !== "غير متاح") {
                message += `🗺️ *رابط الخريطة:* [اضغط لفتح الخريطة](${payload["رابط الخريطة"]})\n`;
            }

            const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(telegramUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => {
                logBox.innerHTML = `
                    تم تسجيل <strong>${payload["نوع العملية"]}</strong> للموظف <strong>${payload["اسم الموظف"]}</strong> بنجاح!<br>
                    📍 الموقع المستهدف: <strong>${payload["الموقع المستهدف"]}</strong><br>
                    📊 تم تحديث قاعدة البيانات وإشعار قناة الإدارة بالتليجرام.
                `;
                logBox.style.borderRightColor = (payload["نوع العملية"] === 'حضور') ? '#2ecc71' : '#e74c3c';
            });
        }

        function saveDataToSystemLog(payload) {
            let systemLog = JSON.parse(localStorage.getItem('system_excel_log')) || [];
            systemLog.push(payload);
            localStorage.setItem('system_excel_log', JSON.stringify(systemLog));
        }

        function saveDataOffline(payload) {
            let offlineQueue = JSON.parse(localStorage.getItem('offline_queue')) || [];
            offlineQueue.push(payload);
            localStorage.setItem('offline_queue', JSON.stringify(offlineQueue));
        }

        async function syncOfflineData() {
            let offlineQueue = JSON.parse(localStorage.getItem('offline_queue')) || [];
            if (offlineQueue.length === 0) return;
            
            for (let i = 0; i < offlineQueue.length; i++) {
                let payload = offlineQueue[i];
                sendToPythonServer(payload); 
                sendToTelegram(payload);
            }
            localStorage.removeItem('offline_queue');
        }

        function calculateShiftHours() {
            const checkIn = localStorage.getItem('today_check_in');
            const checkOut = localStorage.getItem('today_check_out');
            if (checkIn && checkOut) {
                const diffMs = new Date(checkOut) - new Date(checkIn);
                if (diffMs > 0) {
                    const diffHrs = Math.floor(diffMs / 3600000);
                    const diffMins = Math.floor((diffMs % 3600000) / 60000);
                    return `${diffHrs} ساعة و ${diffMins} دقيقة`;
                }
            }
            return "غير محدد بعد";
        }

        function updateMiniDashboard() {
            const checkIn = localStorage.getItem('today_check_in');
            const checkOut = localStorage.getItem('today_check_out');
            let html = "";
            if (checkIn) html += `🕒 حضور اليوم: ${new Date(checkIn).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}<br>`;
            if (checkOut) html += `🕒 انصراف اليوم: ${new Date(checkOut).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}<br>`;
            if (checkIn && checkOut) html += `<strong>⏱️ إجمالي الساعات: ${calculateShiftHours()}</strong>`;
            shiftStats.innerHTML = html || "لم يتم تسجيل حضور وانصراف لليوم لحساب الساعات بعد.";
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminContent');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        function exportToExcel() {
            const password = document.getElementById('adminPass').value;
            if (password !== '1234') {
                alert("❌ عذراً! كلمة مرور المدير غير صحيحة.");
                return;
            }

            let systemLog = JSON.parse(localStorage.getItem('system_excel_log')) || [];
            if (systemLog.length === 0) {
                alert("📊 لا توجد أي بيانات مسجلة في هذا الجهاز حالياً لتصديرها.");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(systemLog);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "سجل الحضور والغياب المباشر");
            XLSX.writeFile(workbook, `تقرير_حركات_الجهاز_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function clearAllData() {
            const password = document.getElementById('adminPass').value;
            if (password !== '1234') {
                alert("❌ عذراً! كلمة مرور المدير غير صحيحة.");
                return;
            }
            if (confirm("⚠️ هل أنت متأكد من مسح السجل المحلي الماكث في هذا المتصفح؟")) {
                localStorage.removeItem('system_excel_log');
                alert("🗑️ تم تفريغ الذاكرة المحلية للجهاز.");
            }
        }
    </script>
</body>
</html>

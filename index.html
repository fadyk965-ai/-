<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف الذكي - YAM</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .company-logo {
            font-size: 36px;
            font-weight: bold;
            color: #007bff;
            margin: 0 0 5px 0;
            font-family: 'Arial Black', sans-serif;
        }

        h2 { color: #333; margin-top: 0; margin-bottom: 25px; font-size: 20px; }

        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .site-select, .name-input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            outline: none;
            box-sizing: border-box;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-attendance { background-color: #2ecc71; }
        .btn-attendance:hover { background-color: #27ae60; }

        .btn-departure { background-color: #e74c3c; }
        .btn-departure:hover { background-color: #c0392b; }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .online { background-color: #d4edda; color: #155724; }
        .offline { background-color: #f8d7da; color: #721c24; }

        .log-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f8f9fa;
            border-right: 4px solid #3498db;
            border-radius: 4px;
            text-align: right;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .dashboard-mini {
            margin-top: 25px;
            border-top: 2px dashed #e0e0e0;
            padding-top: 15px;
            text-align: right;
        }
        .dashboard-mini h3 { font-size: 16px; color: #333; margin-bottom: 10px; }
        .shift-info {
            background-color: #e8f4fd;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #1a73e8;
        }

        .location-info { margin-top: 8px; color: #2980b9; font-weight: bold; }
        .bonus-info { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="company-logo">YAM</h1>
        <h2>نظام الحضور والانصراف الذكي</h2>
        
        <div id="networkStatus" class="status-badge online">🌐 متصل بالإنترنت</div>

        <div class="form-group">
            <label for="employeeName">👤 اسم الموظف:</label>
            <input type="text" id="employeeName" class="name-input" placeholder="اكتب اسمك بالكامل أول مرة فقط">
        </div>

        <div class="form-group">
            <label for="locationSelect">📍 اختر موقع العمل المتوقع:</label>
            <select id="locationSelect" class="site-select">
                <option value="">-- اختر الموقع من هنا --</option>
                <option value="المقر الرئيسي">المقر الرئيسي</option>
                <option value="موقع التجمع الخامس">موقع التجمع الخامس</option>
                <option value="موقع العاصمة الإدارية">موقع العاصمة الإدارية</option>
                <option value="موقع أكتوبر">موقع أكتوبر</option>
            </select>
        </div>

        <div class="btn-container">
            <button class="btn btn-attendance" onclick="startProcess('حضور')">تسجيل حضور</button>
            <button class="btn btn-departure" onclick="startProcess('انصراف')">تسجيل انصراف</button>
        </div>

        <div class="log-box" id="logBox">
            لم يتم تسجيل أي عملية بعد.
        </div>

        <div class="dashboard-mini">
            <h3>📊 ملخص الوردية اليوم:</h3>
            <div id="shiftStats" class="shift-info">
                لم يتم تسجيل حضور وانصراف لليوم لحساب الساعات بعد.
            </div>
        </div>
    </div>

    <script>
        const logBox = document.getElementById('logBox');
        const locationSelect = document.getElementById('locationSelect');
        const employeeNameInput = document.getElementById('employeeName');
        const networkStatus = document.getElementById('networkStatus');
        const shiftStats = document.getElementById('shiftStats');
        
        // البيانات الخاصة بك
        const TELEGRAM_BOT_TOKEN = '8899159530:AAEnYvrr7Y_whfUO0T7-HeIgbWfy33oi7ME';
        const TELEGRAM_CHAT_ID = '-1003959462967'; 

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        function updateNetworkStatus() {
            if (navigator.onLine) {
                networkStatus.innerHTML = "🌐 متصل بالإنترنت";
                networkStatus.className = "status-badge online";
                syncOfflineData(); 
            } else {
                networkStatus.innerHTML = "📡 وضع الأوفلاين (الشبكة مقطوعة)";
                networkStatus.className = "status-badge offline";
            }
        }

        window.onload = function() {
            updateNetworkStatus();
            
            const savedName = localStorage.getItem('emp_name');
            if (savedName) {
                employeeNameInput.value = savedName;
            }

            const todayDateStr = new Date().toLocaleDateString('ar-EG');
            const lastSavedDate = localStorage.getItem('last_saved_date');
            if (lastSavedDate && lastSavedDate !== todayDateStr) {
                localStorage.removeItem('today_check_in');
                localStorage.removeItem('today_check_out');
            }
            localStorage.setItem('last_saved_date', todayDateStr);

            updateMiniDashboard();
        };

        function startProcess(type) {
            const empName = employeeNameInput.value.trim();
            const selectedLocation = locationSelect.value;

            if (!empName) { alert("برجاء كتابة الاسم بالكامل أولاً!"); return; }
            if (!selectedLocation) { alert("برجاء اختيار موقع العمل أولاً!"); return; }

            localStorage.setItem('emp_name', empName);

            logBox.innerHTML = "⏳ جاري تحديد موقعك الجغرافي الدقيق وتحليل العنوان...";
            logBox.style.borderRightColor = '#f1c40f';

            if (navigator.geolocation) {
                // تفعيل خيار الدقة العالية لضمان جلب إحداثيات صحيحة بنسبة 100%
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // استدعاء دالة تحويل الإحداثيات لعنوان عربي
                        const realAddress = await getAddressFromCoords(lat, lng);
                        processData(type, lat, lng, selectedLocation, empName, realAddress);
                    },
                    (error) => { 
                        processData(type, 0, 0, selectedLocation, empName, "غير متاح (تم رفض إذن تحديد الموقع)");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                processData(type, 0, 0, selectedLocation, empName, "المتصفح لا يدعم تحديد الموقع");
            }
        }

        // دالة مخصصة لترجمة خطوط الطول والعرض لعنوان حقيقي باللغة العربية
        async function getAddressFromCoords(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
                const data = await response.json();
                if (data && data.display_name) {
                    return data.display_name;
                }
                return "يتعذر تحديد اسم المنطقة بدقة";
            } catch (error) {
                console.error("فشل جلب اسم العنوان:", error);
                return "تم جلب الإحداثيات (وتعذر الاتصال بخادم العناوين)";
            }
        }

        function processData(type, lat, lng, locationName, empName, realAddress) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString('ar-EG');

            let isLateDeparture = false;
            if (type === 'انصراف' && now.getHours() >= 19) {
                isLateDeparture = true;
            }

            if (type === 'حضور') {
                localStorage.setItem('today_check_in', now.toISOString());
            } else {
                localStorage.setItem('today_check_out', now.toISOString());
            }
            updateMiniDashboard();

            const totalHoursFormatted = calculateShiftHours();

            const payload = {
                employeeName: empName,
                type: type,
                date: dateString,
                time: timeString,
                latitude: lat === 0 ? "غير متاح" : lat,
                longitude: lng === 0 ? "غير متاح" : lng,
                locationName: locationName,
                actualAddress: realAddress, // إضافة العنوان الفعلي هنا
                lateDeparture: isLateDeparture ? "نعم (يوم ونص)" : "لا",
                totalWorkHours: totalHoursFormatted,
                isOfflineData: !navigator.onLine ? "نعم (تم الحفظ بدون إنترنت)" : "لا"
            };

            if (!navigator.onLine) {
                saveDataOffline(payload);
                logBox.innerHTML = `
                    📥 <strong>تم الحفظ في وضع الأوفلاين!</strong><br>
                    الشبكة مقطوعة حالياً. تم حفظ عملية الـ <strong>${type}</strong> بأمان على جهازك وسيرسل السيستم البيانات لتليجرام تلقائياً فور عودة الإنترنت.
                `;
                logBox.style.borderRightColor = '#e67e22';
                return;
            }

            sendToTelegram(payload);
        }

        function sendToTelegram(payload) {
            logBox.innerHTML = "⏳ جاري إرسال البيانات وحفظها في تليجرام...";

            let message = `🔔 *تسجيل ${payload.type} جديد* \n\n`;
            message += `👤 *الموظف:* ${payload.employeeName}\n`;
            message += `📍 *الموقع المستهدف:* ${payload.locationName}\n`;
            message += `🌍 *الموقع الفعلي الحالي:* ${payload.actualAddress}\n`; // سطر يوضح هو فين بالظبط
            message += `📅 *التاريخ:* ${payload.date}\n`;
            message += `⏰ *الوقت المعتمد:* ${payload.time}\n`;
            message += `⏱️ *إجمالي ساعات العمل اليوم:* ${payload.totalWorkHours}\n`;
            message += `🕒 *انصراف متأخر:* ${payload.lateDeparture}\n`;
            message += `🌐 *حالة الشبكة أثناء التسجيل:* ${payload.isOfflineData}\n`;
            
            if(payload.latitude !== "غير متاح") {
                message += `🗺️ *رابط الخريطة المباشر:* [اضغط لفتح خريطة المكان](https://www.google.com/maps?q=${payload.latitude},${payload.longitude})\n`;
            }

            const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            fetch(telegramUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => {
                if (!response.ok) throw new Error('فشل الإرسال لتليجرام');
                
                let bonus = payload.lateDeparture === "نعم (يوم ونص)" ? "<br><span class='bonus-info'>🕒 انصراف متأخر: تم احتساب الوقت الإضافي (يوم ونصف).</span>" : "";
                logBox.innerHTML = `
                    تم تسجيل <strong>${payload.type}</strong> للموظف <strong>${payload.employeeName}</strong> بنجاح!<br>
                    📍 الموقع المختار: <strong>${payload.locationName}</strong><br>
                    🌍 موقعك الفعلي: <strong>${payload.actualAddress}</strong><br>
                    📅 التاريخ: ${payload.date} | ⏰ الوقت: ${payload.time}
                    ${bonus}
                `;
                logBox.style.borderRightColor = (payload.type === 'حضور') ? '#2ecc71' : '#e74c3c';
            })
            .catch(error => {
                console.error("خطأ إرسال، تحويل للأوفلاين:", error);
                saveDataOffline(payload);
            });
        }

        function saveDataOffline(payload) {
            let offlineQueue = JSON.parse(localStorage.getItem('offline_queue')) || [];
            offlineQueue.push(payload);
            localStorage.setItem('offline_queue', JSON.stringify(offlineQueue));
        }

        async function syncOfflineData() {
            let offlineQueue = JSON.parse(localStorage.getItem('offline_queue')) || [];
            if (offlineQueue.length === 0) return;

            logBox.innerHTML = `⏳ جاري ترحيل ${offlineQueue.length} عمليات مسجلة أوفلاين...`;
            
            for (let i = 0; i < offlineQueue.length; i++) {
                let payload = offlineQueue[i];
                payload.isOfflineData = "نعم (تمت المزامنة لاحقاً فور توفر الشبكة)";
                
                let message = `📥 *ترحيل عملية متأخرة من وضع الأوفلاين (${payload.type})* \n\n`;
                message += `👤 *الموظف:* ${payload.employeeName}\n`;
                message += `📍 *الموقع:* ${payload.locationName}\n`;
                message += `🌍 *الموقع الفعلي الحقيقي:* ${payload.actualAddress}\n`;
                message += `📅 *التاريخ:* ${payload.date}\n`;
                message += `⏰ *الوقت الأصلي للحدوث:* ${payload.time}\n`;
                message += `⏱ *إجمالي ساعات العمل:* ${payload.totalWorkHours}\n`;
                
                if(payload.latitude !== "غير متاح") {
                    message += `🗺️ *الموقع الجغرافي الخرائط:* [اضغط لفتح خريطة المكان](https://www.google.com/maps?q=${payload.latitude},${payload.longitude})\n`;
                }

                const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

                try {
                    await fetch(telegramUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (e) {
                    console.error("فشلت المزامنة مؤقتاً، سيتم المحاولة لاحقاً", e);
                    return; 
                }
            }

            localStorage.removeItem('offline_queue');
            updateMiniDashboard();
            alert("🌐 رائع! تم استعادة الإنترنت وترحيل جميع العمليات المحفوظة أوفلاين بنجاح للقناة.");
        }

        function calculateShiftHours() {
            const checkIn = localStorage.getItem('today_check_in');
            const checkOut = localStorage.getItem('today_check_out');
            if (checkIn && checkOut) {
                const diffMs = new Date(checkOut) - new Date(checkIn);
                if (diffMs > 0) {
                    const diffHrs = Math.floor(diffMs / 3600000);
                    const diffMins = Math.floor((diffMs % 3600000) / 60000);
                    return `${diffHrs} ساعة و ${diffMins} دقيقة`;
                }
            }
            return "غير محدد بعد";
        }

        function updateMiniDashboard() {
            const checkIn = localStorage.getItem('today_check_in');
            const checkOut = localStorage.getItem('today_check_out');
            
            let html = "";
            if (checkIn) {
                const timeIn = new Date(checkIn).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                html += `🕒 وقت حضورك اليوم: ${timeIn}<br>`;
            }
            if (checkOut) {
                const timeOut = new Date(checkOut).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                html += `🕒 وقت انصرافك اليوم: ${timeOut}<br>`;
            }
            if (checkIn && checkOut) {
                html += `<strong>⏱️ إجمالي ساعات العمل: ${calculateShiftHours()}</strong>`;
            }
            if (html !== "") {
                shiftStats.innerHTML = html;
            } else {
                shiftStats.innerHTML = "لم يتم تسجيل حضور وانصراف لليوم لحساب الساعات بعد.";
            }
        }
    </script>
</body>
</html>

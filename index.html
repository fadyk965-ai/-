<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف الذكي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 380px;
        }

        h2 { color: #333; margin-bottom: 25px; }

        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-attendance { background-color: #2ecc71; }
        .btn-attendance:hover { background-color: #27ae60; }

        .btn-departure { background-color: #e74c3c; }
        .btn-departure:hover { background-color: #c0392b; }

        .log-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-right: 4px solid #3498db;
            border-radius: 4px;
            text-align: right;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .location-info { margin-top: 8px; color: #2980b9; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تسجيل الدوام والربط بجوجل شيت</h2>
        
        <div class="btn-container">
            <button class="btn btn-attendance" onclick="startProcess('حضور')">تسجيل حضور</button>
            <button class="btn btn-departure" onclick="startProcess('انصراف')">تسجيل انصراف</button>
        </div>

        <div class="log-box" id="logBox">
            لم يتم تسجيل أي عملية بعد.
        </div>
    </div>

    <script>
        const logBox = document.getElementById('logBox');
        
        // ⚠️ ضَع الرابط الذي نسخته من الـ Web App الخاص بجوجل شيت هنا بين العلامتين
        const GOOGLE_SCRIPT_URL = 'ضع_رابط_جوجل_هنا';

        // 📍 هنا بنسجل المواقع والفروع المتوفرة عندك بالإحداثيات والنطاق بالمتر
        // (تقدر تعدل الأرقام دي والأسماء براحتك أو تضيف فروع تانية)
        const SAVED_LOCATIONS = [
            { name: "المقر الرئيسي (الدقي)", lat: 30.0384, lng: 31.2124, radius: 50 },
            { name: "فرع التجمع الخامس", lat: 30.0169, lng: 31.4334, radius: 70 },
            { name: "فرع الإسكندرية", lat: 31.2001, lng: 29.9187, radius: 60 }
        ];

        // 🧮 دالة لحساب المسافة بين نقطتين بالمتر (Haversine Formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; // نصف قطر الأرض بالمتر
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // المسافة بالمتر
        }

        // 🔍 دالة لفحص موقع الموظف ومقارنته بالفروع المتسجلة
        function detectLocationName(employeeLat, employeeLng) {
            for (let location of SAVED_LOCATIONS) {
                const distance = calculateDistance(employeeLat, employeeLng, location.lat, location.lng);
                // لو الموظف جوه النطاق (الـ radius) المسموح للفرع
                if (distance <= location.radius) {
                    return location.name;
                }
            }
            return "موقع غير معروف / خارج النطاق المسموح";
        }

        function startProcess(type) {
            logBox.innerHTML = "⏳ جاري تحديد موقعك الجغرافي...";
            logBox.style.borderRightColor = '#f1c40f';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        sendDataToGoogleSheet(type, position.coords.latitude, position.coords.longitude);
                    },
                    (error) => { handleLocationError(error); }
                );
            } else {
                logBox.innerHTML = "❌ متصفحك لا يدعم خاصية تحديد الموقع الجغرافي.";
                logBox.style.borderRightColor = '#e74c3c';
            }
        }

        function sendDataToGoogleSheet(type, lat, lng) {
            logBox.innerHTML = "⏳ جاري فحص الموقع وإرسال البيانات...";
            
            // تحديد اسم الموقع بناءً على الإحداثيات
            const detectedLocation = detectLocationName(lat, lng);

            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString('ar-EG');

            // تجهيز البيانات لإرسالها (ضفنا فيها اسم الموقع المكتشف تلقائياً)
            const payload = {
                type: type,
                date: dateString,
                time: timeString,
                latitude: lat,
                longitude: lng,
                locationName: detectedLocation // الحقل الجديد اللي هيروح لجوجل شيت
            };

            // إرسال البيانات باستخدام Fetch API لجوجل شيت
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                // عرض رسالة النجاح للموظف بعد الإرسال مع اسم الموقع
                logBox.innerHTML = `
                    تم تسجيل <strong>${type}</strong> وإرسالها للشيت بنجاح!<br>
                    📅 التاريخ: ${dateString}<br>
                    ⏰ الوقت: ${timeString}<br>
                    📍 الموقع المكتشف: <strong>${detectedLocation}</strong><br>
                    <div class="location-info">
                        🗺️ الإحداثيات المحفوظة:<br>
                        • خط العرض: ${lat.toFixed(6)}<br>
                        • خط الطول: ${lng.toFixed(6)}
                    </div>
                `;
                logBox.style.borderRightColor = (type === 'حضور') ? '#2ecc71' : '#e74c3c';
            })
            .catch(error => {
                logBox.innerHTML = "❌ حدث خطأ أثناء إرسال البيانات لجوجل شيت.";
                logBox.style.borderRightColor = '#e74c3c';
                console.error('Error:', error);
            });
        }

        function handleLocationError(error) {
            logBox.style.borderRightColor = '#e74c3c';
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    logBox.innerHTML = "❌ يجب السماح للمتصفح بالوصول للموقع لتسجيل الدوام.";
                    break;
                default:
                    logBox.innerHTML = "❌ حدث خطأ أثناء تحديد الموقع.";
                    break;
            }
        }
    </script>

</body>
</html>

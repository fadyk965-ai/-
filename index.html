<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف الذكي - YAM</title>
    <!-- مكتبة Supabase الرسمية للاتصال المباشر -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة توليد ملفات الإكسيل -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .company-logo {
            font-size: 36px;
            font-weight: bold;
            color: #007bff;
            margin: 0 0 5px 0;
            font-family: 'Arial Black', sans-serif;
        }
        h2 { color: #333; margin-top: 0; margin-bottom: 25px; font-size: 20px; }
        .form-group { text-align: right; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        .site-select, .name-input {
            width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc;
            border-radius: 6px; background-color: #fff; outline: none; box-sizing: border-box;
        }
        .btn-container { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 20px; }
        .btn {
            flex: 1; padding: 12px 20px; font-size: 16px; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease; color: white;
        }
        .btn-attendance { background-color: #2ecc71; }
        .btn-attendance:hover { background-color: #27ae60; }
        .btn-departure { background-color: #e74c3c; }
        .btn-departure:hover { background-color: #c0392b; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
        .online { background-color: #d4edda; color: #155724; }
        .offline { background-color: #f8d7da; color: #721c24; }
        .log-box {
            margin-top: 15px; padding: 15px; background-color: #f8f9fa; border-right: 4px solid #3498db;
            border-radius: 4px; text-align: right; font-size: 14px; color: #555; line-height: 1.6;
        }
        .dashboard-mini { margin-top: 25px; border-top: 2px dashed #e0e0e0; padding-top: 15px; text-align: right; }
        .dashboard-mini h3 { font-size: 16px; color: #333; margin-bottom: 10px; }
        .shift-info { background-color: #e8f4fd; padding: 10px; border-radius: 6px; font-size: 13px; color: #1a73e8; }
        .admin-section { margin-top: 30px; padding-top: 15px; border-top: 2px solid #eee; text-align: center; }
        .admin-toggle { font-size: 12px; color: #999; cursor: pointer; text-decoration: underline; }
        .admin-content { display: none; margin-top: 10px; }
        .btn-excel { background-color: #1f7246; color: white; width: 100%; padding: 10px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 8px; }
        .btn-excel:hover { background-color: #155231; }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="company-logo">YAM</h1>
        <h2>نظام الحضور والانصراف الذكي</h2>
        
        <div id="networkStatus" class="status-badge online">🌐 متصل بالإنترنت</div>

        <div class="form-group">
            <label for="employeeName">👤 اسم الموظف:</label>
            <input type="text" id="employeeName" class="name-input" placeholder="اكتب اسمك بالكامل أول مرة فقط">
        </div>

        <div class="form-group">
            <label for="locationSelect">📍 اختر موقع العمل المتوقع:</label>
            <select id="locationSelect" class="site-select">
                <option value="">-- اختر الموقع من هنا --</option>
                <option value="المقر الرئيسي">المقر الرئيسي</option>
                <option value="موقع التجمع الخامس">موقع التجمع الخامس</option>
                <option value="موقع العاصمة الإدارية">موقع العاصمة الإدارية</option>
                <option value="مخزن الامام الشافعي">مخزن الامام الشافعي</option>
                <option value="9 سايد">9 سايد</option>
                <option value="محل سبايسي تشيكن البير">محل سبايسي تشيكن البير</option>
                <option value="محل سبايسي تشيكن مدينه نصر">محل سبايسي تشيكن مدينه نصر</option>
                <option value="فيلا الحج محمد اب تاون">فيلا الحج محمد اب تاون</option>
                <option value="اب تاون">اب تاون</option>
                <option value="مزرعه الحج محمد">مزرعه الحج محمد</option>
                <option value="مشروع نيكست الهضبي الوسطي">مشروع نيكست الهضبي الوسطي</option>
                <option value="مصنع جرجس التجمع ">مصنع جرجس التجمع</option>
                <option value="جدران زهراء المعادي">جدران زهراء المعادي</option>
            </select>
        </div>

        <div class="btn-container">
            <button class="btn btn-attendance" onclick="startProcess('حضور')">تسجيل حضور</button>
            <button class="btn btn-departure" onclick="withCheckOutLogic()">تسجيل انصراف</button>
        </div>

        <div class="log-box" id="logBox">لم يتم تسجيل أي عملية بعد.</div>

        <div class="dashboard-mini">
            <h3>📊 ملخص الوردية اليوم:</h3>
            <div id="shiftStats" class="shift-info">لم يتم تسجيل حضور وانصراف لليوم لحساب الساعات بعد.</div>
        </div>

        <div class="admin-section">
            <span class="admin-toggle" onclick="toggleAdminPanel()">🔒 لوحة التحكم للمدير (إكسيل)</span>
            <div id="adminContent" class="admin-content">
                <input type="password" id="adminPass" class="name-input" placeholder="أدخل كلمة مرور المدير" style="text-align: center; margin-bottom: 5px;">
                <button class="btn-excel" onclick="exportToExcel()">تحميل تقرير إكسيل محلي 📊</button>
                <button class="btn-excel" onclick="clearAllData()" style="background-color: #c0392b; margin-top: 5px; font-size: 12px;">تصفير السجل المحلي للبيانات ⚠️</button>
            </div>
        </div>
    </div>

    <script>
        const logBox = document.getElementById('logBox');
        const locationSelect = document.getElementById('locationSelect');
        const employeeNameInput = document.getElementById('employeeName');
        const networkStatus = document.getElementById('networkStatus');
        const shiftStats = document.getElementById('shiftStats');
        
        // ⚙️ إعدادات الربط المباشر (املأ البيانات هنا فوراً)
        const SUPABASE_URL = 'https://your-project.supabase.co'; // رابط سوبابيس الخاص بك
        const SUPABASE_ANON_KEY = 'your-anon-key'; // مفتاح anon الطويل
        const TELEGRAM_BOT_TOKEN = '8899159530:AAEnYvrr7Y_whfUO0T7-HeIgbWfy33oi7ME';
        const TELEGRAM_CHAT_ID = '-1003959462967'; 

        // تفعيل اتصال Supabase المباشر
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        function updateNetworkStatus() {
            if (navigator.onLine) {
                networkStatus.innerHTML = "🌐 متصل بالإنترنت";
                networkStatus.className = "status-badge online";
                syncOfflineData(); 
            } else {
                networkStatus.innerHTML = "📡 وضع الأوفلاين (الشبكة مقطوعة)";
                networkStatus.className = "status-badge offline";
            }
        }

        window.onload = function() {
            updateNetworkStatus();
            const savedName = localStorage.getItem('emp_name');
            if (savedName) employeeNameInput.value = savedName;
            updateMiniDashboard();
        };

        function startProcess(type) {
            const empName = employeeNameInput.value.trim();
            const selectedLocation = locationSelect.value;
            if (!empName || !selectedLocation) { alert("برجاء إدخال الاسم واختيار الموقع!"); return; }

            localStorage.setItem('emp_name', empName);
            logBox.innerHTML = "⏳ جاري تحديد موقعك الجغرافي...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const address = await getAddressFromCoords(lat, lng);
                        processData(type, lat, lng, selectedLocation, empName, address);
                    },
                    () => { processData(type, 0, 0, selectedLocation, empName, "إذن الموقع مرفوض"); },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                processData(type, 0, 0, selectedLocation, empName, "الجهاز لا يدعم الموقع");
            }
        }

        async function getAddressFromCoords(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
                const data = await response.json();
                return data.display_name || "عنوان غير معروف";
            } catch { return "تعذر جلب تفاصيل العنوان"; }
        }

        function withCheckOutLogic() { startProcess('انصراف'); }

        async function processData(type, lat, lng, locationName, empName, realAddress) {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            const dateString = now.toLocaleDateString('ar-EG');
            const mapUrl = lat !== 0 ? `https://www.google.com/maps?q=${lat},${lng}` : "غير متاح";

            if (type === 'حضور') localStorage.setItem('today_check_in', now.toISOString());
            else localStorage.setItem('today_check_out', now.toISOString());
            
            updateMiniDashboard();
            const totalHours = calculateShiftHours();

            const payload = {
                employee: empName,
                type: type,
                target_location: locationName,
                actual_location: realAddress,
                date: dateString,
                time: timeString,
                hours: totalHours,
                map_url: mapUrl
            };

            saveDataToSystemLog(payload);

            if (navigator.onLine) {
                // حفظ مباشر في داتا بيز Supabase بدون سيرفر وسيط
                try {
                    await supabase.from('attendance').insert([payload]);
                    logBox.innerHTML = `✅ تم تسجيل الـ ${type} بنجاح في قاعدة البيانات المباشرة!`;
                } catch (err) {
                    console.error("Supabase Error:", err);
                }
                sendToTelegram(payload);
            } else {
                saveDataOffline(payload);
                logBox.innerHTML = `📥 تم الحفظ محلياً (أوفلاين)، وسيتم المزامنة فور عودة الشبكة.`;
            }
        }

        function sendToTelegram(p) {
            let msg = `🔔 *تسجيل ${p.type} جديد*\n\n👤 *الموظف:* ${p.employee}\n📍 *الموقع:* ${p.target_location}\n🌍 *الموقع الفعلي:* ${p.actual_location}\n📅 *التاريخ:* ${p.date} | ⏰ *الوقت:* ${p.time}\n⏱️ *ساعات العمل:* ${p.hours}\n🗺️ [رابط الخريطة](${p.map_url})`;
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'Markdown' })
            });
        }

        function saveDataToSystemLog(p) {
            let log = JSON.parse(localStorage.getItem('system_excel_log')) || [];
            log.push(p);
            localStorage.setItem('system_excel_log', JSON.stringify(log));
        }

        function saveDataOffline(p) {
            let q = JSON.parse(localStorage.getItem('offline_queue')) || [];
            q.push(p);
            localStorage.setItem('offline_queue', JSON.stringify(q));
        }

        async function syncOfflineData() {
            let q = JSON.parse(localStorage.getItem('offline_queue')) || [];
            if (q.length === 0) return;
            for (let p of q) {
                await supabase.from('attendance').insert([p]);
                sendToTelegram(p);
            }
            localStorage.removeItem('offline_queue');
        }

        function calculateShiftHours() {
            const cin = localStorage.getItem('today_check_in');
            const cout = localStorage.getItem('today_check_out');
            if (cin && cout) {
                const diff = new Date(cout) - new Date(cin);
                if (diff > 0) return `${Math.floor(diff / 3600000)} ساعة و ${Math.floor((diff % 3600000) / 60000)} دقيقة`;
            }
            return "غير محدد";
        }

        function updateMiniDashboard() {
            const cin = localStorage.getItem('today_check_in');
            const cout = localStorage.getItem('today_check_out');
            let html = "";
            if (cin) html += `🕒 حضور: ${new Date(cin).toLocaleTimeString('ar-EG')}<br>`;
            if (cout) html += `🕒 انصراف: ${new Date(cout).toLocaleTimeString('ar-EG')}<br>`;
            if (cin && cout) html += `<strong>⏱️ الساعات: ${calculateShiftHours()}</strong>`;
            shiftStats.innerHTML = html || "في انتظار تسجيل الحركات الحية.";
        }

        function toggleAdminPanel() { const p = document.getElementById('adminContent'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
        function exportToExcel() {
            if (document.getElementById('adminPass').value !== '1234') { alert("خطأ!"); return; }
            let log = JSON.parse(localStorage.getItem('system_excel_log')) || [];
            const ws = XLSX.utils.json_to_sheet(log); const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Log"); XLSX.writeFile(wb, "report.xlsx");
        }
        function clearAllData() { if (document.getElementById('adminPass').value === '1234' && confirm("مسح؟")) localStorage.removeItem('system_excel_log'); }
    </script>
</body>
</html>
